name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Jellyfin.Plugin.Refract/Jellyfin.Plugin.Refract.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.Refract
          path: Jellyfin.Plugin.Refract/bin/Release/net10.0/Jellyfin.Plugin.Refract.dll
