<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link Refract</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #10131a; color: #e9eef8; font: 16px/1.5 system-ui, sans-serif; }
        main { width: 100%; max-width: 380px; padding: 32px; background: #1b2130; border-radius: 14px; }
        h1 { margin: 0 0 4px; font-size: 22px; }
        p { margin: 0 0 20px; color: #9aa7bd; font-size: 14px; }
        label { display: block; margin: 14px 0 6px; font-size: 13px; color: #9aa7bd; }
        input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #2c3547; border-radius: 8px;
                background: #10131a; color: inherit; font: inherit; }
        button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #4fc3f7;
                 color: #10131a; font: inherit; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: .5; cursor: default; }
        code { display: block; margin: 10px 0; padding: 14px; background: #10131a; border-radius: 8px;
               font-size: 26px; letter-spacing: 4px; text-align: center; }
        a { color: #4fc3f7; }
        .note { margin-top: 20px; font-size: 12px; color: #7d8798; }
        .warn { color: #ff9f7a; }
        .hide { display: none !important; }
    </style>
</head>
<body>
<main>
    <h1>Refract</h1>
    <p>Record what you watch in your own Refract account.</p>

    <form id="login">
        <label for="username">Jellyfin username</label>
        <input id="username" autocomplete="username" required>
        <label for="password">Jellyfin password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit" id="submit">Continue</button>
    </form>

    <div id="step" class="hide">
        <p id="stepText"></p>
        <code id="userCode"></code>
        <p><a id="verificationLink" target="_blank" rel="noopener"></a></p>
        <button id="done" class="hide" type="button">Start over</button>
    </div>

    <p class="note">Your password goes to your own Jellyfin server and is not stored. This page only keeps the
        Refract tokens, which the server saves for your account.</p>
</main>
<script>
    const base = location.pathname.replace(/\/Refract\/Link.*$/, '');
    const client = 'MediaBrowser Client="Refract", Device="Web", DeviceId="refract-link", Version="1.0.6.0"';
    const REFRACT_VERSION = "__VERSION__";
    let token = null;
    let userId = null;
    let pollStop = null;

    const show = (id, on) => document.getElementById(id).classList.toggle('hide', !on);

    function step(text, code, uri) {
        show('login', false);
        show('step', true);
        document.getElementById('stepText').textContent = text;
        document.getElementById('userCode').textContent = code || '';
        show('userCode', !!code);
        const link = document.getElementById('verificationLink');
        link.href = uri || '#';
        link.textContent = uri || '';
        show('verificationLink', !!uri);
    }

    function stop() {
        if (pollStop) { pollStop(); pollStop = null; }
    }

    // The auth headers, fetch wrapper and approval poll live in flow.js, shared
    // with the in-page widget, so they stay in sync.
    const auth = () => window.refractFlow.headers(token, client);

    function api(path, init) {
        return window.refractFlow.request(base, client, token, path, init);
    }

    function poll(seconds) {
        stop();
        pollStop = window.refractFlow.poll(base, client, token, userId, seconds, (status, detail) => {
            if (status === 'authorized') {
                localStorage.setItem('refract-linked', '1');
                step('Approved. You can close this page.');
                return;
            }
            if (status === 'denied' || status === 'expired') {
                step(status === 'denied' ? 'Refused in the Refract app.' : 'The code expired. Reload the page.');
                show('done', true);
                return;
            }
            document.getElementById('stepText').textContent = 'Waiting for approval.';
        });
    }

    async function authorize() {
        const result = await fetch(base + '/Refract/Users/' + userId + '/Authorize', {
            method: 'POST',
            headers: auth()
        }).then(r => r.json());
        step('Open the link below on your phone and type this code.', result.userCode, result.verificationUri);
        poll(result.interval);
    }

    function bootstrap() {
        document.getElementById('login').addEventListener('submit', async (event) => {
            event.preventDefault();
            const submit = document.getElementById('submit');
            submit.disabled = true;
            document.querySelector('.warn')?.remove();
            try {
                const auth = await fetch(base + '/Users/AuthenticateByName', {
                    method: 'POST',
                    headers: { 'Authorization': client, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Username: document.getElementById('username').value,
                        Pw: document.getElementById('password').value
                    })
                });
                if (!auth.ok) { throw new Error('Jellyfin refused those credentials.'); }
                const session = await auth.json();
                token = session.AccessToken;
                userId = session.User.Id;
                document.getElementById('password').value = '';
                const me = await api('/Refract/Me');
                if (me.linked) {
                    localStorage.setItem('refract-linked', '1');
                    step('Your account is already linked. You can close this page.');
                    show('done', true);
                    return;
                }
                await authorize();
            } catch (error) {
                const note = document.createElement('p');
                note.className = 'note warn';
                note.textContent = error.message;
                document.querySelector('main').appendChild(note);
                submit.disabled = false;
            }
        });

        document.getElementById('done').addEventListener('click', () => location.reload());
        window.addEventListener('beforeunload', () => { token = null; stop(); });
    }

    // Load the shared flow after the page knows its base path, so the trailing
    // slash on /Refract/Link/ does not resolve the script to /Refract/Link/Flow.
    const flow = document.createElement('script');
    flow.src = base + '/Refract/Flow?v=' + REFRACT_VERSION;
    flow.onload = bootstrap;
    document.head.appendChild(flow);
</script>
</body>
</html>
